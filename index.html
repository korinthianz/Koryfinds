<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoryFinds - Curated Deals & Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-600">KoryFinds</h1>
      <span class="text-xs text-gray-400">Affiliate Picks</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-12">
    <div class="text-center mb-10">
      <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Top Curated Deals</h2>
      <p class="text-gray-500 text-sm">Handpicked quality finds updated daily.</p>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
      <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm flex flex-col justify-between">
        <div>
          <div class="h-40 bg-gray-100 rounded-lg flex items-center justify-center text-gray-400 text-sm mb-4">Product Image</div>
          <h3 class="font-bold text-lg mb-2">Featured Product Title</h3>
          <p class="text-xs text-gray-500 mb-4">Short description highlighting key specifications and benefits.</p>
        </div>
        <a href="#" target="_blank" rel="nofollow noopener" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2 rounded-lg text-center transition">View on Amazon</a>
      </div>
    </div>
  </main>
</body>
</html>
